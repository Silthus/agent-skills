<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Explainer card. render.ts screenshots .card at 2x. Keep the tokens; draw inside .card.
  Give each cell's text one element: loose text and <code> directly inside a flex row become separate items.
  Use .grid with an inline grid-template-columns for rows of state, one column per place that holds it.
  In inline SVG, set colors as CSS (style="fill: var(--old)"); var() in an attribute (fill="var(--old)") does not work.
  An arrowhead: <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/></marker></defs>
  then marker-end="url(#head)" on a line or path.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --panel: #f6f8fa;
    --old: #cf222e; --old-soft: #ffebe9; --new: #1a7f37; --new-soft: #dafbe1;
    --warn: #9a6700; --warn-soft: #fff8c5; --badge: #0969da;
    --sans: -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
  .card { display: inline-block; box-sizing: border-box; width: 720px; padding: 20px 24px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 16px 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grid { display: grid; gap: 8px; align-items: stretch; }
  .box { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); text-align: center; }
  .old { background: var(--old-soft); border-color: var(--old); }
  .new { background: var(--new-soft); border-color: var(--new); }
  .warn { background: var(--warn-soft); border-color: var(--warn); }
  .ghost { border-style: dashed; }
  .grow { flex: 1; }
  .badge { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--badge); color: #fff; font-size: 12px; font-weight: 600; }
  .note { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  code { font: 12px var(--mono); }
  svg text { font: 12px var(--sans); fill: var(--fg); }
</style>
</head>
<body>
<div class="card">
  <h2>The mechanism, in a few words</h2>

  <h3>Before: what happens today</h3>
  <div class="row">
    <div class="box">step</div>
    <div class="box old grow">the slow or wrong part</div>
    <div class="box">step</div>
  </div>

  <h3>After: what happens with this change</h3>
  <div class="row">
    <div class="box">step</div>
    <div class="box new">the new part</div>
    <div class="box ghost grow">work moved off the path</div>
  </div>

  <p class="note">Guard: the fact that keeps the new behavior safe.</p>
</div>
</body>
</html>
